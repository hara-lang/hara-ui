name: Deploy UI preview to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.title, '[deploy]'))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Reconcile ui.hara-lang.org
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"cname":"ui.hara-lang.org","build_type":"workflow"}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
      - name: Verify live OG metadata
        run: |
          page="$(mktemp)"
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location --max-time 20 \
                https://ui.hara-lang.org/ >"$page" \
              && grep -q 'property="og:image"' "$page" \
              && grep -q 'property="og:image:width" content="3840"' "$page"; then
              echo "Verified the UI OG metadata."
              exit 0
            fi
            [[ "$attempt" -lt 20 ]] && sleep 15
          done
          echo "ui.hara-lang.org did not publish the expected OG metadata." >&2
          exit 1
